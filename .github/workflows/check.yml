name: check

# Grades a pull request opened against a mission branch.
# pull_request_target always reads this file from the default branch, so it
# lives on `main`. The learner's code is never run: the grader comes from
# `main`, and the pull request commits are fetched as data only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["mission/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # The token is read-only and nothing fetched below is executed.
      - name: Fetch the pull request commits
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
      - name: Grade
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 check/check.py --mission "${BASE_REF#mission/}" --head pr/head --main-ref HEAD
